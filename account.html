<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Đổi mật khẩu tài khoản MovieVerse." />
    <title>Đổi mật khẩu | MovieVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-scene" aria-label="MovieVerse">
        <a class="auth-brand" href="/" aria-label="MovieVerse trang chủ">
          <span class="auth-brand-mark">M</span>
          <span>movie<span>verse</span></span>
        </a>
        <div class="auth-scene-copy">
          <p class="auth-eyebrow">MovieVerse · Bảo mật tài khoản</p>
          <h1>Giữ an toàn<br />thế giới của bạn.</h1>
        </div>
        <span class="auth-scene-index" aria-hidden="true">MV / 02</span>
      </section>

      <section class="auth-panel" aria-labelledby="authTitle">
        <a class="auth-home-link" href="/">← Trang chủ</a>
        <div class="auth-content">
          <p class="auth-eyebrow">Cài đặt tài khoản</p>
          <h2 id="authTitle">Đổi mật khẩu</h2>
          <p class="auth-subtitle">Xác nhận mật khẩu hiện tại để đặt mật khẩu mới.</p>

          <form class="auth-form" id="passwordForm" method="post">
            <div class="auth-field">
              <label for="currentPassword">Mật khẩu hiện tại</label>
              <div class="auth-password-wrapper">
                <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" minlength="8" maxlength="128" required />
                <button type="button" class="auth-password-toggle" data-label="mật khẩu hiện tại" aria-label="Hiện mật khẩu hiện tại" title="Hiện mật khẩu hiện tại" aria-pressed="false" aria-controls="currentPassword">
                  <svg class="password-icon eye-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="password-icon eye-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                    <line x1="2" x2="22" y1="2" y2="22"></line>
                  </svg>
                </button>
              </div>
            </div>
            <div class="auth-field">
              <label for="newPassword">Mật khẩu mới</label>
              <div class="auth-password-wrapper">
                <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
                <button type="button" class="auth-password-toggle" data-label="mật khẩu mới" aria-label="Hiện mật khẩu mới" title="Hiện mật khẩu mới" aria-pressed="false" aria-controls="newPassword">
                  <svg class="password-icon eye-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="password-icon eye-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                    <line x1="2" x2="22" y1="2" y2="22"></line>
                  </svg>
                </button>
              </div>
            </div>
            <div class="auth-field">
              <label for="confirmPassword">Nhập lại mật khẩu mới</label>
              <div class="auth-password-wrapper">
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
                <button type="button" class="auth-password-toggle" data-label="xác nhận mật khẩu mới" aria-label="Hiện xác nhận mật khẩu mới" title="Hiện xác nhận mật khẩu mới" aria-pressed="false" aria-controls="confirmPassword">
                  <svg class="password-icon eye-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="password-icon eye-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                    <line x1="2" x2="22" y1="2" y2="22"></line>
                  </svg>
                </button>
              </div>
            </div>
            <button class="auth-submit" type="submit">Cập nhật mật khẩu <span aria-hidden="true">→</span></button>
          </form>
          <p class="auth-switch"><a href="/">Hủy và quay lại MovieVerse</a></p>
        </div>
        <p class="auth-legal">Sau khi đổi, bạn cần đăng nhập lại trên các thiết bị.</p>
      </section>
    </main>
    <script type="module" src="/src/account-page.js"></script>
  </body>
</html>
