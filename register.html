<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tạo tài khoản MovieVerse." />
    <title>Đăng ký | MovieVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-scene" aria-label="MovieVerse">
        <a class="auth-brand" href="/" aria-label="MovieVerse trang chủ">
          <span class="auth-brand-mark">M</span>
          <span>movie<span>verse</span></span>
        </a>
        <div class="auth-scene-copy">
          <p class="auth-eyebrow">MovieVerse · Câu chuyện bắt đầu</p>
          <h1>Mỗi bộ phim,<br />một thế giới mới.</h1>
        </div>
        <span class="auth-scene-index" aria-hidden="true">MV / 01</span>
      </section>

      <section class="auth-panel" aria-labelledby="authTitle">
        <a class="auth-home-link" href="/">← Trang chủ</a>
        <div class="auth-content">
          <p class="auth-eyebrow">Gia nhập cộng đồng</p>
          <h2 id="authTitle">Tạo tài khoản</h2>
          <p class="auth-subtitle">Lưu lại những bộ phim và đánh giá bạn yêu thích.</p>

          <form class="auth-form" method="post">
            <div class="auth-field">
              <label for="registerName">Tên hiển thị</label>
              <input id="registerName" name="name" type="text" placeholder="Tên của bạn" autocomplete="name" maxlength="40" required />
            </div>
            <div class="auth-field">
              <label for="registerEmail">Email</label>
              <input id="registerEmail" name="email" type="email" placeholder="ten@email.com" autocomplete="email" maxlength="254" required />
            </div>
            <div class="auth-field">
              <label for="registerPassword">Mật khẩu</label>
              <div class="auth-password-wrapper">
                <input id="registerPassword" name="password" type="password" placeholder="8–128 ký tự" autocomplete="new-password" minlength="8" maxlength="128" required />
                <button type="button" class="auth-password-toggle" data-label="mật khẩu" aria-label="Hiện mật khẩu" title="Hiện mật khẩu" aria-pressed="false" aria-controls="registerPassword">
                  <svg class="password-icon eye-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="password-icon eye-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                    <line x1="2" x2="22" y1="2" y2="22"></line>
                  </svg>
                </button>
              </div>
            </div>
            <label class="auth-checkbox auth-terms">
              <input type="checkbox" name="terms" required />
              <span>Tôi đồng ý với <a href="/info.html#terms">điều khoản sử dụng</a>.</span>
            </label>
            <button class="auth-submit" type="submit">Tạo tài khoản <span aria-hidden="true">→</span></button>
          </form>

          <p class="auth-switch">Đã có tài khoản? <a href="/login.html">Đăng nhập</a></p>
        </div>
        <p class="auth-legal">© 2024 MovieVerse</p>
      </section>
    </main>
    <script type="module" src="/src/auth-page.js"></script>
  </body>
</html>
