<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Đăng nhập vào tài khoản MovieVerse." />
    <title>Đăng nhập | MovieVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-scene" aria-label="MovieVerse">
        <a class="auth-brand" href="./" aria-label="MovieVerse trang chủ">
          <span class="auth-brand-mark">M</span>
          <span>movie<span>verse</span></span>
        </a>
        <div class="auth-scene-copy">
          <p class="auth-eyebrow">MovieVerse · Câu chuyện bắt đầu</p>
          <h1>Mỗi bộ phim,<br />một thế giới mới.</h1>
        </div>
        <span class="auth-scene-index" aria-hidden="true">MV / 01</span>
      </section>

      <section class="auth-panel" aria-labelledby="authTitle">
        <a class="auth-home-link" href="./">← Trang chủ</a>
        <div class="auth-content">
          <p class="auth-eyebrow">Chào mừng trở lại</p>
          <h2 id="authTitle">Đăng nhập</h2>
          <p class="auth-subtitle">
            Tiếp tục khám phá thế giới điện ảnh của bạn.
          </p>

          <form class="auth-form" method="post">
            <div class="auth-field">
              <label for="loginEmail">Email</label>
              <input
                id="loginEmail"
                name="email"
                type="email"
                placeholder="ten@email.com"
                autocomplete="email"
                required
              />
            </div>
            <div class="auth-field">
              <label for="loginPassword">Mật khẩu</label>
              <input
                id="loginPassword"
                name="password"
                type="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
              />
            </div>
            <div class="auth-options">
              <label class="auth-checkbox"
                ><input type="checkbox" name="remember" />
                <span>Ghi nhớ đăng nhập</span></label
              >
              <a href="#forgot-password">Quên mật khẩu?</a>
            </div>
            <button class="auth-submit" type="submit">
              Đăng nhập <span aria-hidden="true">→</span>
            </button>
          </form>

          <p class="auth-switch">
            Chưa có tài khoản? <a href="./register.html">Tạo tài khoản</a>
          </p>
        </div>
        <p class="auth-legal">© 2024 MovieVerse</p>
      </section>
    </main>
    <script type="module" src="./src/auth-page.js"></script>
  </body>
</html>
