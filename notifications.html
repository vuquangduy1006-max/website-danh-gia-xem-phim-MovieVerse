
<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thông báo bình luận | MovieVerse</title>

  <style>
    body {
      margin: 0;
      background: #0b0d10;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .notifications-page {
      max-width: 900px;
      margin: 70px auto;
      padding: 24px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #a1a1aa;
      line-height: 1.6;
    }

    .notification-list {
      margin-top: 30px;
    }

    .notification-item {
      background: #17191e;
      border: 1px solid #30333b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .notification-item strong {
      color: #ff7655;
    }

    .notification-item p {
      line-height: 1.6;
    }

    .notification-item small {
      color: #a1a1aa;
    }

    .back-link {
      color: #ff7655;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="notifications-page">
    <a class="back-link" href="/index.html">
      ← Về trang chủ
    </a>

    <h1>🔔 Thông báo bình luận</h1>

    <p class="subtitle">
      Những câu trả lời mới cho bình luận của bạn sẽ xuất hiện tại đây.
    </p>

    <div class="notification-list" id="notificationList">
      Đang tải thông báo...
    </div>
  </main>

  <script type="module">
    import { getSession } from "/src/data/auth.js";

    const list = document.getElementById("notificationList");
    const session = getSession();

    if (!session) {
      list.textContent = "Vui lòng đăng nhập để xem thông báo.";
    } else {
      loadNotifications();
    }

    async function loadNotifications() {
      try {
        const response = await fetch("/api/notifications", {
          headers: {
            Authorization: `Bearer ${session.token}`,
          },
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        const markResponse = await fetch("/api/notifications/read", {
  method: "PATCH",
  headers: {
    Authorization: `Bearer ${session.token}`,
  },
});

if (!markResponse.ok) {
  console.error("Không thể đánh dấu thông báo đã đọc");
}

        const notifications = Array.isArray(data.notifications)
          ? data.notifications
          : [];

        list.replaceChildren();

        if (notifications.length === 0) {
          list.textContent = "Bạn chưa có thông báo bình luận nào.";
          return;
        }

        for (const notification of notifications) {
          const item = document.createElement("div");
          item.className = "notification-item";

          const title = document.createElement("strong");
          title.textContent =
            `${notification.author} đã trả lời bình luận của bạn`;

          const movie = document.createElement("p");
          movie.textContent = `Phim: ${notification.movieTitle}`;

          const comment = document.createElement("p");
          comment.textContent = notification.comment;

          const date = document.createElement("small");
          date.textContent = notification.date || "";

          item.append(title, movie, comment, date);
          list.append(item);
        }
      } catch (error) {
        console.error("Không tải được thông báo:", error);

        list.textContent =
          `Không thể tải thông báo (${error.message}). Vui lòng thử lại.`;
      }
    }
  </script>
</body>
</html>
