<header class="site-header{{headerClass}}">
  <div class="container nav-wrap">
    <a class="brand" href="{{homeHref}}" aria-label="MovieVerse trang chủ"
      ><span class="brand-mark">M</span><span>movie<span>verse</span></span></a
    >
    <nav class="main-nav" aria-label="Điều hướng chính">
      <a class="{{homeActive}}" href="{{homeHref}}" {{homeCurrent}}
        >Trang chủ</a
      >
      <a
        class="{{newMoviesActive}}"
        href="{{newMoviesHref}}"
        {{newMoviesCurrent}}
        >Phim mới</a
      >
      <details class="genre-nav">
        <summary>Thể loại</summary>
        <div class="genre-dropdown" aria-label="Chọn thể loại phim">
          {{genreMenu}}
        </div>
      </details>
      <a class="{{reviewsActive}}" href="{{reviewsHref}}" {{reviewsCurrent}}
        >Đánh giá</a
      >
      <a
        class="{{favoritesActive}}"
        href="{{favoritesHref}}"
        {{favoritesCurrent}}
        >Yêu thích</a
      >
      <a href="/history.html">Lịch sử xem</a>
      <a class="{{rankingActive}}" href="{{rankingHref}}" {{rankingCurrent}}
        >Top phim</a
      >
    </nav>
    <div class="nav-actions">{{headerActions}}</div>
  </div>
</header>
